  body::after{content:"";position:fixed;inset:0;z-index:-1;
    background:radial-gradient(ellipse 75% 60% at 50% 40%, rgba(11,15,26,.8), rgba(11,15,26,.38) 70%, rgba(11,15,26,.22)),
               linear-gradient(180deg, rgba(11,15,26,.1), rgba(11,15,26,.5))}

  .wrap{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;text-align:center}
  section{width:100%}
  .glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

  /* language toggle */
  .lang-toggle{display:inline-flex;gap:4px;padding:4px;border-radius:999px;margin-bottom:18px;
    background:rgba(20,26,43,.75);border:1px solid rgba(42,212,255,.25);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .lang-toggle button{border:0;cursor:pointer;background:transparent;color:var(--muted);
    font:600 14px/1 'Cairo','Hind',sans-serif;padding:9px 16px;border-radius:999px;transition:background .2s,color .2s}
  .lang-toggle button[data-lang="hi"]{font-family:'Hind',sans-serif}
  .lang-toggle button.active{background:linear-gradient(90deg,var(--brand2),var(--brand));color:#fff}

  /* hero creative */
  .art{position:relative;width:158px;height:158px;margin:6px auto 28px;animation:float 4s ease-in-out infinite}
  .art::before{content:"";position:absolute;inset:-5px;border-radius:50%;
    background:conic-gradient(from 0deg,var(--brand2),var(--brand),var(--gold),var(--gold2),var(--brand2));
    animation:spin 5s linear infinite;box-shadow:0 0 38px rgba(255,200,61,.35),0 0 70px rgba(26,124,255,.35)}
  .art img{position:relative;display:block;width:100%;height:100%;border-radius:50%;border:4px solid var(--bg);object-fit:cover}
  .badge{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);white-space:nowrap;
    padding:6px 13px;border-radius:999px;font-weight:800;font-size:13px;color:#2a1700;
    background:linear-gradient(90deg,var(--gold2),var(--gold));box-shadow:0 6px 18px rgba(255,159,26,.45);border:2px solid var(--bg)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  .logo{display:block;width:min(150px,42vw);height:auto;margin:0 auto 14px;filter:drop-shadow(0 6px 24px rgba(26,124,255,.45))}

  /* compact countdown pill */
  .pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;margin-bottom:14px;font-size:13px;font-weight:700;color:var(--muted)}
  .pill b{color:#fff;font-size:15px;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
  .live{width:8px;height:8px;border-radius:50%;background:#ff4d5e;flex:none;animation:live 1.4s infinite}
  @keyframes live{0%{box-shadow:0 0 0 0 rgba(255,77,94,.7)}70%{box-shadow:0 0 0 8px rgba(255,77,94,0)}100%{box-shadow:0 0 0 0 rgba(255,77,94,0)}}

  h1{font-size:26px;font-weight:800;line-height:1.32;margin-bottom:10px;text-shadow:0 2px 18px rgba(0,0,0,.6)}
  bdi{direction:ltr;unicode-bidi:isolate}
  h1 .money{background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  h1 span,h2 span{background:linear-gradient(90deg,#3aa0ff,var(--brand));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:#d3d9ea;font-size:15.5px;line-height:1.7;margin-bottom:18px;text-shadow:0 1px 10px rgba(0,0,0,.7)}
  .sub b{color:#fff}
  h2{font-size:22px;font-weight:800;line-height:1.35;margin-bottom:6px}
  .h2sub{color:var(--muted);font-size:14px;margin-bottom:16px}

  /* CTA */
  .cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:360px;padding:17px 22px;border-radius:14px;
    background:linear-gradient(180deg,var(--cta),var(--cta2));color:#fff;text-decoration:none;font-weight:800;font-size:18px;
    animation:pulse 2s infinite;-webkit-tap-highlight-color:transparent}
  .cta:active{transform:scale(.98)}
  .cta svg{width:22px;height:22px;flex:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(var(--cta-rgb),.55)}70%{box-shadow:0 0 0 16px rgba(var(--cta-rgb),0)}100%{box-shadow:0 0 0 0 rgba(var(--cta-rgb),0)}}
  .micro{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 14px;margin-top:11px;font-size:13px;color:var(--muted)}
  .micro span::before{content:"✓ ";color:var(--brand);font-weight:800}

  /* latest-win ticker */
  .ticker{display:none;margin:14px auto 0;max-width:360px;padding:9px 14px;border-radius:12px;font-size:13.5px;font-weight:600;
    align-items:center;justify-content:center;gap:8px;min-height:40px}
  .ticker.on{display:flex}
  .ticker .amt{color:var(--gold);font-weight:800}
  .ticker .fade{transition:opacity .35s}
  .sample{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 6px;border-radius:6px;background:#ff4d5e;color:#fff;vertical-align:middle}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
  .stat{padding:14px 6px 12px;border-radius:16px}
  .stat b{display:block;font:800 23px/1.1 'Cairo',sans-serif;direction:ltr;unicode-bidi:isolate;
    background:linear-gradient(90deg,#fff,#cfeeff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat.gold b{background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text}
  .stat small{display:block;margin-top:5px;font-size:12px;line-height:1.35;color:var(--muted)}

  .block{margin-top:40px}

  /* winners */
  .winners{display:grid;gap:10px;text-align:start}
  .win{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px}
  .av{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--brand2),var(--brand))}
  .win .who{flex:1;min-width:0}
  .win .who b{display:block;font-size:15px}
  .win .who small{display:block;font-size:12.5px;color:var(--muted)}
  .win .amt{flex:none;text-align:end}
  .win .amt b{display:block;font:800 18px/1.1 'Cairo',sans-serif;color:var(--gold);direction:ltr;unicode-bidi:isolate}
  .win .amt small{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(42,212,255,.14);color:var(--brand)}
  .wcta{margin-top:16px}

  /* benefits */
  .benefits{list-style:none;display:grid;gap:12px}
  .benefits li{display:flex;gap:14px;align-items:flex-start;text-align:start;padding:16px;border-radius:16px}
  .ico{flex:none;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,rgba(26,124,255,.25),rgba(42,212,255,.15));color:var(--brand)}
  .ico.g{background:linear-gradient(135deg,rgba(255,159,26,.28),rgba(255,200,61,.14));color:var(--gold)}
  .ico svg{width:22px;height:22px}
  .benefits h3{font-size:16px;font-weight:800;margin-bottom:2px}
  .benefits p{font-size:14px;line-height:1.6;color:var(--muted)}

  /* steps */
  .steps{list-style:none;display:grid;gap:10px;counter-reset:s}
  .steps li{display:flex;gap:14px;align-items:center;text-align:start;padding:14px 16px;border-radius:16px}
  .steps li::before{counter-increment:s;content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--brand2),var(--brand))}
  .steps h3{font-size:16px;font-weight:800}
  .steps p{font-size:14px;color:var(--muted);line-height:1.55}

  /* FAQ */
  .faq{display:grid;gap:10px;text-align:start}
  .faq details{border-radius:14px}
  .faq summary{list-style:none;cursor:pointer;padding:15px 16px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:12px;align-items:center}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary::after{content:"+";font-size:22px;line-height:1;color:var(--brand);transition:transform .2s}
  .faq details[open] summary::after{transform:rotate(45deg)}
  .faq p{padding:0 16px 16px;font-size:14px;line-height:1.7;color:var(--muted)}

  /* final */
  .final{padding:26px 18px;border-radius:20px;border:1px solid rgba(255,200,61,.3);
    background:linear-gradient(180deg,rgba(255,159,26,.12),rgba(20,26,43,.78));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .final p{color:var(--muted);font-size:15px;line-height:1.7;margin:4px 0 18px}
  .digits{display:flex;gap:8px;justify-content:center;direction:ltr;margin:14px 0 4px}
  .digits div{min-width:66px;padding:8px 6px 6px;border-radius:12px;background:rgba(11,15,26,.6);border:1px solid var(--line)}
  .digits b{display:block;font:800 26px/1.1 'Cairo',sans-serif;font-variant-numeric:tabular-nums}
  .digits small{display:block;font-size:11px;color:var(--muted);margin-top:2px}

  footer{margin-top:30px;color:var(--muted);font-size:12.5px;line-height:1.8;text-align:center}

  /* sticky join bar */
  .sticky{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:rgba(11,15,26,.9);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    display:flex;align-items:center;justify-content:center;gap:12px;transform:translateY(110%);transition:transform .3s}
  .sticky.show{transform:none}
  .sticky .mini{font-size:12px;color:var(--muted);line-height:1.3;text-align:start}
  .sticky .mini b{display:block;color:#fff;font-size:16px;font-variant-numeric:tabular-nums;direction:ltr}
  html[dir="rtl"] .sticky .mini b{text-align:right}
  .sticky .cta{width:auto;flex:1 1 auto;max-width:280px;padding:13px 18px;font-size:16px;animation:none}

  @media (min-width:700px){ h1{font-size:34px} .wrap{max-width:520px} .art{width:200px;height:200px} }
  @media (prefers-reduced-motion:reduce){ .cta,.live,.art,.art::before{animation:none} }
</style>
</head>

      en:{ sub:'Daily Pick 4 & Quick 3 draws, with winnings paid <b>straight to your wallet</b>. Join free on Telegram for draw alerts, results and winner news.',
           cta:'Join free on Telegram', sticky:'Join free', m1:'Free', m2:'No spam', m3:'Leave anytime',
           b4t:'Never miss a draw', b4d:'A reminder before every draw closes, and results the moment they’re out.',
           s1t:'Tap “Join free on Telegram”', s1d:'Telegram opens. One tap, no forms.',
           s2t:'Get alerts & results', s2d:'Draw reminders, results and winner news arrive automatically.',
           q2:'Is it free to join the channel?', a2:'Yes. Joining costs nothing, and you can mute or leave anytime with one tap.',
           fP:'Join now and get the reminder before the draw closes. It takes less than 10 seconds.' },
      ar:{ sub:'سحوبات Pick 4 وQuick 3 يوميًا، والأرباح تُضاف <b>مباشرة إلى محفظتك</b>. انضم مجانًا على تيليجرام لتصلك التنبيهات والنتائج وأخبار الفائزين.',
           cta:'انضم مجانًا عبر تيليجرام', sticky:'انضم مجانًا', m1:'مجاني', m2:'بدون إزعاج', m3:'غادر متى شئت',
           b4t:'لن يفوتك أي سحب', b4d:'تذكير قبل إغلاق كل سحب، والنتائج فور إعلانها.',
           s1t:'اضغط «انضم مجانًا»', s1d:'يُفتح تيليجرام بضغطة واحدة، بدون نماذج.',
           s2t:'استلم التنبيهات والنتائج', s2d:'تصلك تذكيرات السحب والنتائج وأخبار الفائزين تلقائيًا.',
           q2:'هل الانضمام إلى القناة مجاني؟', a2:'نعم. الانضمام مجاني، ويمكنك كتم الإشعارات أو المغادرة بضغطة واحدة.',
           fP:'انضم الآن ليصلك التذكير قبل إغلاق السحب. الأمر يستغرق أقل من 10 ثوانٍ.' },
      hi:{ sub:'रोज़ Pick 4 और Quick 3 ड्रॉ, और जीत की रकम <b>सीधे आपके वॉलेट में</b>। ड्रॉ अलर्ट, रिज़ल्ट और विजेताओं की खबर के लिए Telegram पर फ्री जॉइन करें।',
           cta:'Telegram पर फ्री जॉइन करें', sticky:'फ्री जॉइन करें', m1:'फ्री', m2:'कोई स्पैम नहीं', m3:'कभी भी छोड़ें',
           b4t:'कोई ड्रॉ मिस नहीं', b4d:'हर ड्रॉ बंद होने से पहले रिमाइंडर, और रिज़ल्ट आते ही अपडेट।',
           s1t:'“फ्री जॉइन करें” दबाएं', s1d:'Telegram खुल जाएगा। एक टैप, कोई फ़ॉर्म नहीं।',
           s2t:'अलर्ट और रिज़ल्ट पाएं', s2d:'ड्रॉ रिमाइंडर, रिज़ल्ट और विजेताओं की खबर अपने-आप आएगी।',
           q2:'क्या चैनल जॉइन करना फ्री है?', a2:'हाँ। जॉइन करने का कोई चार्ज नहीं, और एक टैप में म्यूट करें या छोड़ दें।',
           fP:'अभी जॉइन करें और ड्रॉ बंद होने से पहले रिमाइंडर पाएं। इसमें 10 सेकंड से भी कम लगते हैं।' }
    }
  };

  var ch = CH[CHANNEL] || CH.whatsapp, lang;
  var nf = new Intl.NumberFormat('en-US');
  function moneyShort(n){ return n >= 1e6 ? '$' + (n/1e6).toFixed(n % 1e6 ? 1 : 0) + 'M+' : (n >= 1e3 ? '$' + Math.round(n/1e3) + 'K' : '$' + n); }
  function drawTimeLabel(l){
    if(!DRAW_TIME) return '';
    var p = DRAW_TIME.split(':'), d = new Date(Date.UTC(2026,0,1,(+p[0]-4+24)%24,+p[1]||0));
    try{ return d.toLocaleTimeString(l==='ar'?'ar-AE':(l==='hi'?'en-IN':'en-US'),{hour:'numeric',minute:'2-digit',timeZone:'Asia/Dubai'}); }catch(e){ return DRAW_TIME; }
  }
  function str(key){ var o = TC[CHANNEL] && TC[CHANNEL][lang]; return (o && o[key] != null) ? o[key] : T[lang][key]; }
  function fill(s, plain){
    function b(v){ return plain ? v : '<bdi>' + v + '</bdi>'; }
    return String(s).replace(/\{ch\}/g, ch.name[lang]).replace(/\{paidS\}/g, b(moneyShort(PAID_TOTAL)))
      .replace(/\{paidL\}\+/g, b('$' + nf.format(PAID_TOTAL) + '+')).replace(/\{paidL\}/g, b('$' + nf.format(PAID_TOTAL)))
      .replace(/\{poolS\}/g, b('$' + nf.format(POOL))).replace(/\{entry\}/g, b(ENTRY_FROM)).replace(/\{players\}/g, b(nf.format(PLAYERS)))
      .replace(/\{time\}/g, drawTimeLabel(lang));
  }
  function joinLink(){
    return CHANNEL === 'telegram' ? TELEGRAM_URL : 'https://wa.me/' + WHATSAPP_NO + '?text=' + encodeURIComponent(fill(str('wa'), true));
  }

  /* ---------- winners ---------- */
  var SAMPLE = [
    {name:'Sample A.',country:'AE',amount:'$10,000',game:'Pick 4',date:null,ago:1},
    {name:'Sample B.',country:'SA',amount:'$2,500', game:'Quick 3',date:null,ago:2},
    {name:'Sample C.',country:'IN',amount:'$5,000', game:'Pick 4',date:null,ago:3}
  ];
  var isPreview = !WINNERS.length && /[?&]preview=1/.test(location.search);
  var LIST = WINNERS.length ? WINNERS : (isPreview ? SAMPLE : []);
  function flag(cc){ return cc ? cc.toUpperCase().replace(/./g, function(c){ return String.fromCodePoint(127397 + c.charCodeAt(0)); }) : ''; }
  function country(cc){ try{ return new Intl.DisplayNames([lang],{type:'region'}).of(cc.toUpperCase()); }catch(e){ return cc; } }
  function ago(w){
    var days = w.date ? Math.max(0, Math.round((Date.now() - new Date(w.date + 'T12:00:00+04:00')) / 864e5)) : (w.ago || 0);
    try{ return new Intl.RelativeTimeFormat(lang,{numeric:'auto'}).format(-days,'day'); }catch(e){ return days + 'd'; }
  }
  function initials(n){ return n.split(/\s+/).map(function(p){ return p.charAt(0); }).join('').slice(0,2).toUpperCase(); }
  function renderWinners(){
    var sec = document.querySelector('.js-winners-sec');
    if(!LIST.length){ sec.hidden = true; return; }
    sec.hidden = false;
    var tag = isPreview ? ' <span class="sample">SAMPLE</span>' : '';
    document.querySelector('.js-winners').innerHTML = LIST.slice(0,6).map(function(w){
      return '<div class="win glass"><span class="av">' + initials(w.name) + '</span>' +
        '<div class="who"><b>' + w.name + ' ' + flag(w.country) + tag + '</b><small>' + country(w.country) + ' · ' + ago(w) + '</small></div>' +
        '<div class="amt"><b>' + w.amount + '</b><small>' + fill(T[lang].wWon).replace('{game}', w.game) + '</small></div></div>';
    }).join('');
  }
  var tickI = 0, tickTimer;
  function renderTicker(){
    var box = document.querySelector('.js-ticker'), el = document.querySelector('.js-tick');
    if(!LIST.length){ box.classList.remove('on'); return; }
    box.classList.add('on');
    function show(){
      var w = LIST[tickI % LIST.length]; tickI++;
      el.style.opacity = 0;
      setTimeout(function(){
        el.innerHTML = '🎉 ' + T[lang].tick.replace('{name}', w.name).replace('{flag}', flag(w.country)).replace('{amount}', '<bdi>' + w.amount + '</bdi>').replace('{ago}', ago(w)) + (isPreview ? ' <span class="sample">SAMPLE</span>' : '');
        el.style.opacity = 1;
      }, 300);
    }
    clearInterval(tickTimer); show(); if(LIST.length > 1) tickTimer = setInterval(show, 3800);
  }

  /* ---------- language ---------- */
  function setLang(l){
    lang = T[l] ? l : DEFAULT_LANG;
    var html = document.documentElement; html.lang = lang; html.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    document.title = fill(str('title'), true);
    document.querySelectorAll('[data-i18n]').forEach(function(el){ el.innerHTML = fill(str(el.getAttribute('data-i18n'))); });
    document.querySelectorAll('.js-join').forEach(function(a){ a.href = joinLink(); });
    document.querySelectorAll('.lang-toggle button').forEach(function(b){ b.classList.toggle('active', b.dataset.lang === lang); });
    renderWinners(); renderTicker();
    try{ localStorage.setItem('rizoon_lang', lang); }catch(e){}
  }

  document.querySelectorAll('.js-icon').forEach(function(i){ i.outerHTML = ch.icon; });
  var urlLang = new URLSearchParams(location.search).get('lang');
  var saved = null; try{ saved = localStorage.getItem('rizoon_lang'); }catch(e){}
  setLang(urlLang || saved || DEFAULT_LANG);
  document.querySelectorAll('.lang-toggle button').forEach(function(b){ b.addEventListener('click', function(){ setLang(b.dataset.lang); }); });

  document.querySelectorAll('.js-join').forEach(function(a){
    a.addEventListener('click', function(){
      var pos = a.id === 'hero-cta' ? 'hero' : (a.classList.contains('wcta') ? 'winners' : (a.closest('#sticky') ? 'sticky' : 'final'));
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({event: CHANNEL + '_join_click', lang: lang, position: pos});
      if(typeof fbq === 'function') fbq('track', CHANNEL === 'whatsapp' ? 'Contact' : 'Lead');
    });
  });

  /* ---------- count-up stats ---------- */
  function fmt(el, v){
    var f = el.dataset.fmt;
    el.textContent = f === 'money' ? '$' + (v/1e6).toFixed(v >= +el.dataset.to ? 0 : 1).replace(/\.0$/,'') + 'M+'
                   : f === 'k' ? '$' + Math.round(v/1e3) + 'K' : nf.format(Math.round(v)) + '+';
  }
  document.querySelectorAll('.js-count').forEach(function(el){
    var to = +el.dataset.to; fmt(el, to);
    if(!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var io = new IntersectionObserver(function(e){
      if(!e[0].isIntersecting) return; io.disconnect();
      var t0 = performance.now(), D = 1400;
      (function step(t){ var p = Math.min(1, (t - t0) / D), k = 1 - Math.pow(1 - p, 3); fmt(el, to * k); if(p < 1) requestAnimationFrame(step); else fmt(el, to); })(t0);
    }, {threshold:.6});
    io.observe(el);
  });

  /* ---------- countdown (UAE time) ---------- */
  function nextDraw(){
    var p = DRAW_TIME.split(':'), now = new Date();
    var t = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), +p[0] - 4, +p[1] || 0, 0));
    while(t <= now) t = new Date(t.getTime() + 864e5);
    while(t - now > 864e5) t = new Date(t.getTime() - 864e5);
    return t;
  }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  if(DRAW_TIME){
    (function tick(){
      var s = Math.max(0, Math.floor((nextDraw() - new Date()) / 1000));
      var h = pad(Math.floor(s/3600)), m = pad(Math.floor(s%3600/60)), sc = pad(s%60);
      document.querySelectorAll('.js-h').forEach(function(e){ e.textContent = h; });
      document.querySelectorAll('.js-m').forEach(function(e){ e.textContent = m; });
      document.querySelectorAll('.js-s').forEach(function(e){ e.textContent = sc; });
      document.querySelectorAll('.js-hms').forEach(function(e){ e.textContent = h + ':' + m + ':' + sc; });
      setTimeout(tick, 1000 - Date.now() % 1000);
    })();
  } else {
    document.querySelectorAll('.js-timer-wrap, .js-q4').forEach(function(e){ e.style.display = 'none'; });
  }

  /* ---------- sticky bar ---------- */
  (function(){
    var bar = document.getElementById('sticky'), hero = document.getElementById('hero-cta'), fin = document.getElementById('final');
    if(!('IntersectionObserver' in window)) return;
    var heroOff = false, finalOn = false;
    function upd(){ var on = heroOff && !finalOn; bar.classList.toggle('show', on); bar.setAttribute('aria-hidden', !on); }
    new IntersectionObserver(function(e){ heroOff = !e[0].isIntersecting && e[0].boundingClientRect.top < 0; upd(); }).observe(hero);
    new IntersectionObserver(function(e){ finalOn = e[0].isIntersecting; upd(); }, {threshold:.25}).observe(fin);
  })();

  document.getElementById('yr').textContent = new Date().getFullYear();
</script>
